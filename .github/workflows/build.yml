name: Build Cross-Platform

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger from Actions page

jobs:
  # ── Windows build ──────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: MyLogNotifier-Windows
          path: dist-installer-new/*.exe
          if-no-files-found: error


  # ── macOS build (sign + notarize + staple) ─────────────
  #
  # 签名交给 electron-builder（CSC_LINK 就是 base64 的 .p12），公证由
  # package.json 的 mac.notarize=true 在签名之后、打 DMG 之前完成。
  # electron-builder 时序：pack → sign → (afterSign) notarize + staple → build dmg，
  # 所以 DMG 里的 .app 天然已 staple。旧流程「公证完再 electron-builder --mac
  # 重建 DMG」会把 staple 覆盖掉，已去掉。
  build-mac:
    runs-on: macos-latest
    env:
      # 故意不设 CSC_LINK：让 electron-builder 自己建临时 keychain 导入 p12
      # 在本仓库实测失败且只警告不报错（结果 .app 仍是 adhoc，公证 Invalid）。
      # 改为自己导入 keychain + 显式 CSC_NAME，见 "Import signing certificate"。
      # ★ 关键：electron-builder 的 isPullRequest() 用 GITHUB_BASE_REF 判 PR
      # （builder-util/out/util.js:459），而 GitHub Actions 只在 pull_request
      # 事件里设这个变量。命中后它只打一行 warning 就跳过整包签名，包维持
      # Electron 自带的 adhoc 签名 → Helper 无 hardened runtime/时间戳 →
      # Apple 公证 Invalid。本仓库的 PR 都来自同一仓库的分支、secrets 可用，
      # 不存在「不可信 fork」风险，故显式打开。
      CSC_FOR_PULL_REQUEST: "true"
      MAC_CERTS_B64: ${{ secrets.MAC_CERTS }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 预检 1：p12 能解开，证书类型 / Team 正确 ──
      # 这里只读证书（-nokeys）。私钥不由 openssl 判定：本仓库 p12 的私钥是
      # RC2-40 老 PBE，macOS 自带 LibreSSL 解不开，会误报「没有私钥」。
      # 私钥可用性交给下一步用 security 判定。
      - name: Preflight - certificate type and team
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTS_B64:-}" ]; then
            echo "::error::secrets.MAC_CERTS 为空"
            exit 1
          fi

          printf '%s' "$MAC_CERTS_B64" | tr -d '\r\n ' | python3 -c "import base64,sys;open('$RUNNER_TEMP/cert.p12','wb').write(base64.b64decode(sys.stdin.read()))"
          ls -l "$RUNNER_TEMP/cert.p12"

          if ! openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CSC_KEY_PASSWORD" \
                 -nokeys -out "$RUNNER_TEMP/cert.pem" 2>/dev/null; then
            openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$CSC_KEY_PASSWORD" \
                 -legacy -nokeys -out "$RUNNER_TEMP/cert.pem" \
              || { echo "::error::p12 解不开：密码错误，或文件不是 PKCS#12"; exit 1; }
          fi

          openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -subject -issuer -dates
          openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -subject > "$RUNNER_TEMP/subject.txt"

          if ! grep -q "Developer ID Application" "$RUNNER_TEMP/subject.txt"; then
            echo "::error::证书不是 Developer ID Application（Apple Development / Apple Distribution 无法公证）"
            exit 1
          fi
          if [ -n "${APPLE_TEAM_ID:-}" ] && ! grep -qF "($APPLE_TEAM_ID)" "$RUNNER_TEMP/subject.txt"; then
            echo "::error::证书 Team ID 与 secrets.APPLE_TEAM_ID 不一致"
            cat "$RUNNER_TEMP/subject.txt"
            exit 1
          fi

      # ── 导入签名证书并显式指定身份 ──
      # 这一步同时兼作预检：p12 导入后必须能以「含私钥的 Developer ID
      # Application」身份被找到，否则后面 electron-builder 会静默跳过签名。
      - name: Import signing certificate
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCP="$(openssl rand -hex 16)"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"

          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::security import 失败：p12 密码错误，或私钥无法导入"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KCP" "$KC" >/dev/null 2>&1 || true

          # 设为用户搜索列表（替换掉 login），codesign / electron-builder 才找得到
          security list-keychains -d user -s "$KC"

          # 写文件再 grep；不要 grep -q 直接接管道（pipefail 下上游 SIGPIPE 会误判）
          security find-identity -v -p codesigning > "$RUNNER_TEMP/ids.txt" 2>&1 || true
          cat "$RUNNER_TEMP/ids.txt"

          IDENTITY="$(grep -m1 'Developer ID Application' "$RUNNER_TEMP/ids.txt" | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]*[0-9A-Fa-f]+[[:space:]]+"(.*)"/\1/' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::keychain 里没有可用的 Developer ID Application 身份（证书无配对私钥，或导入未生效）"
            exit 1
          fi

          echo "CSC_NAME=$IDENTITY" >> "$GITHUB_ENV"
          echo "用签名身份: $IDENTITY"

      # ── 预检 3：Developer ID 中间证书，避免 "unable to build chain" ──
      - name: Preflight - ensure Developer ID intermediate CA
        run: |
          set -euo pipefail
          if security find-certificate -c "Developer ID Certification Authority" /Library/Keychains/System.keychain >/dev/null 2>&1; then
            echo "中间证书已存在，跳过"
          else
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          fi

      - run: npm ci

      # 邮箱功能的 vendor/ 不在 git 里（.gitignore），CI 上不存在，
      # 缺了它 dist 里就不带 PHP/SnappyMail。需要随包发布时打开这步。
      # - name: Fetch email vendor
      #   run: python3 scripts/fetch-vendor.py

      - name: Build / Sign / Notarize / Staple
        run: |
          set -eo pipefail
          # 双保险：清掉 electron-builder 判定 PR 的唯一依据，
          # 不依赖 CSC_FOR_PULL_REQUEST 的行为是否随版本变化。
          unset GITHUB_BASE_REF
          npx electron-builder --mac --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"

          # 宁可这里红叉，也不要发出一个 adhoc 签名的包。
          if grep -q "code signing will be skipped" "$RUNNER_TEMP/build.log"; then
            echo "::error::electron-builder 跳过了签名（仍会产出 adhoc 包），构建无效"
            exit 1
          fi

      # electron-builder 找不到身份时只 warning 不失败，必须主动核实它到底签没签。
      # job 日志需 admin 才能下载，注解有 10 条上限，所以关键信息写进
      # job summary（check-run 的 output.summary 公开可读）。
      - name: Signing diagnostics
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import os, re, sys
          out = []
          try:
              lines = open(sys.argv[1], encoding='utf-8', errors='replace').read().splitlines()
          except FileNotFoundError:
              lines = []
              out.append('没有 build.log')
          pat = re.compile(r'identity|sign|notariz|certificate|keychain|codesign|skipped|error', re.I)
          hits = [l.rstrip() for l in lines if pat.search(l)]
          out.append('build.log 共 %d 行，命中 %d 行，以下为末尾 80 行' % (len(lines), len(hits)))
          out.append('```')
          out.extend(hits[-80:])
          out.append('```')
          text = '\n'.join(out)
          print(text)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('## Signing diagnostics\n' + text + '\n')
          # 日志末尾才是 electron-builder 的报错，转成 warning 注解（公开可读）
          for l in [x.strip() for x in lines if x.strip()][-8:]:
              print('::warning::' + l[:400])
          PY

      # ── 逐个二进制的签名详情，压缩成注解上报 ──
      # job 日志要 admin 才能下载，注解公开可读，所以关键字段走 ::error::
      - name: Codesign detail
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          apps = sorted(glob.glob('dist-installer-new/*/*.app'))
          if not apps:
              print('没有产出 .app')
              raise SystemExit(0)
          app = apps[0]
          name = os.path.basename(app)[:-4]
          targets = [app, '%s/Contents/MacOS/%s' % (app, name)]
          targets += sorted(glob.glob(os.path.join(app, 'Contents/Frameworks/*.app')))
          targets += sorted(glob.glob(os.path.join(app, 'Contents/Frameworks/*.framework')))
          key = re.compile(r'^(Identifier|Format|CodeDirectory|Signature|Authority|Timestamp|TeamIdentifier)=')
          for t in targets[:5]:
              r = subprocess.run(['codesign', '-dv', '--verbose=4', t],
                                 capture_output=True, text=True)
              raw = (r.stdout or '') + (r.stderr or '')
              picked = [l.strip() for l in raw.splitlines() if key.match(l.strip())]
              msg = ' ; '.join(picked)
              if not msg:
                  msg = raw.strip().replace('\n', ' ')[:220] or '无输出(rc=%d)' % r.returncode
              print('::error::[%s] %s' % (os.path.relpath(t, app), msg[:380].replace('\n', ' ')))
          PY

      # ── 验收：把「公证没生效」变成明确红叉 ──
      - name: Verify signature and notarization
        if: always()
        run: |
          set -euo pipefail
          APP="$(find dist-installer-new -maxdepth 2 -name '*.app' -type d | sort | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::没有产出 .app"
            exit 1
          fi
          echo "APP=$APP"

          codesign -dv --verbose=4 "$APP" > "$RUNNER_TEMP/codesign.txt" 2>&1 || true
          cat "$RUNNER_TEMP/codesign.txt"

          if grep -q "Signature=adhoc" "$RUNNER_TEMP/codesign.txt"; then
            echo "::error::$APP 是 adhoc 签名：没找到签名身份，公证必然 Invalid"
            exit 1
          fi
          if ! grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign.txt"; then
            echo "::error::签名链不是 Developer ID Application"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv --type execute "$APP"

      # ── 失败时重投一次，把 issues 打出来并转成注解 ──
      # job 日志需要 admin 权限才能下载，注解是公开可读的，所以关键信息走 ::error::
      - name: Dump notarization issues (on failure)
        if: failure()
        run: |
          set +e
          APP="$(find dist-installer-new -maxdepth 2 -name '*.app' -type d | sort | head -1)"
          if [ -z "$APP" ]; then echo "无 .app，跳过"; exit 0; fi
          echo "APP=$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"

          xcrun notarytool submit "$RUNNER_TEMP/app.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json > "$RUNNER_TEMP/submit.json" 2>&1
          cat "$RUNNER_TEMP/submit.json"

          ID="$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/submit.json')).get('id',''))" 2>/dev/null)"
          if [ -z "$ID" ]; then echo "拿不到 submission id"; exit 0; fi

          echo "=== notarytool log $ID ==="
          xcrun notarytool log "$ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" > notary-issues.json 2>&1
          cat notary-issues.json

          python3 - <<'PY'
          import json, os
          p = 'notary-issues.json'
          if not os.path.exists(p):
              raise SystemExit(0)
          try:
              d = json.load(open(p))
          except Exception:
              print('::error::notarytool log 不是合法 JSON，看上面原始输出')
              raise SystemExit(0)
          issues = d.get('issues') or []
          print('::error::公证 status=%s issues=%d' % (d.get('status'), len(issues)))
          for i in issues[:2]:
              msg = (i.get('message') or '').replace('\n', ' ')[:200]
              path = (i.get('path') or '(整个包)')
              print('::error::[%s] %s - %s' % (i.get('severity'), path, msg))
          PY

      - name: Upload notarization issues
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notary-issues
          path: notary-issues.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: MyLogNotifier-macOS
          path: dist-installer-new/*.dmg
          if-no-files-found: warn
