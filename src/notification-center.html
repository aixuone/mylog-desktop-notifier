<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息通知</title>
<style>
@font-face {
  font-family: 'System UI';
  src: local('Microsoft YaHei UI'), local('Microsoft YaHei'),
       local('PingFang SC'), local('PingFang HK'),
       local('Noto Sans CJK SC'), local('SimHei'),
       local(system-ui), local(sans-serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'System UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #F5F6F8;
  width: 360px; overflow: hidden; user-select: none;
  -webkit-font-smoothing: antialiased;
  color: #2C2C2A;
}
#app { width: 100%; height: 100%; display: flex; flex-direction: column; background: #F5F6F8; }

/* ── Header ── */
.header {
  height: 48px; flex: 0 0 48px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px;
  background: #ffffff;
  border-bottom: 1px solid #ECECEC;
}
.header .header-icon { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
.header .title { font-size: 15px; font-weight: 600; }
.header .badge {
  font-size: 11px; color: #fff; background: #E8453C;
  border-radius: 10px; padding: 1px 7px; min-width: 18px; text-align: center;
}
.header .spacer { flex: 1; }
.header .btn {
  font-size: 12px; color: #5F5E5A; background: #F1EFE8;
  border: none; border-radius: 10px; padding: 4px 10px;
  cursor: pointer; -webkit-app-region: no-drag; font-family: inherit;
  transition: background 0.15s;
}
.header .btn.close { background: transparent; font-size: 16px; padding: 2px 8px; }
.header .btn.close:hover { background: #E8E6E1; }

/* ── List ──
   max-height 保证窗口封顶时内部滚动；高度由主进程按实测值 setBounds。 */
.list {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 10px 10px 10px;
  max-height: 472px;
}
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-thumb { background: #D8D5CF; border-radius: 3px; }

.section-title {
  font-size: 11px; color: #9A9893; margin: 2px 4px 6px;
  font-weight: 600; letter-spacing: 0.5px;
}
#sec-sys:empty, #sec-conv:empty { display: none; }
#title-sys, #title-conv { display: none; }

/* ── 会话行 ── */
.conv {
  display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 10px; padding: 10px 12px;
  margin-bottom: 8px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  transition: box-shadow 0.12s;
}
.conv:last-child { margin-bottom: 0; }
.conv:hover { box-shadow: 0 3px 8px rgba(0,0,0,0.08); }
.conv.is-focus { box-shadow: inset 3px 0 0 #185FA5, 0 1px 2px rgba(0,0,0,0.04); }

.avatar {
  width: 42px; height: 42px; border-radius: 50%; background: #E6F1FB;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600; color: #185FA5; flex-shrink: 0;
  overflow: hidden; position: relative;
}
.avatar img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  position: absolute; top: 0; left: 0; display: none;
}
.avatar.has-img img { display: block; }
.avatar.has-img .afb { visibility: hidden; }

.conv .body { flex: 1; min-width: 0; }
.conv .row1 { display: flex; align-items: baseline; gap: 6px; }
.conv .name {
  font-size: 13px; font-weight: 600; color: #2C2C2A;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.conv .time { font-size: 11px; color: #B0AEA8; margin-left: auto; flex-shrink: 0; }
.conv .last {
  font-size: 12px; color: #5F5E5A; line-height: 18px; height: 18px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
}
.conv .count {
  background: #E8453C; color: #fff; font-size: 11px; font-weight: 600;
  border-radius: 10px; min-width: 18px; height: 18px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
body.nc-hide-content .conv .last { visibility: hidden; }

/* 新行入场：只作用于「新增行」，绝不重播整窗动画（S1.5） */
@keyframes ncRowIn {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.conv.is-new { animation: ncRowIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }

/* ── 系统通知卡 ── */
.sys { border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.sys.kick { background: #FDECEA; border: 1px solid #F3B5AE; }
.sys.offline { background: #FEF6E7; border: 1px solid #F2D98A; }
.sys .sys-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.sys.kick .sys-title { color: #C0392B; }
.sys.offline .sys-title { color: #B8860B; }
.sys .sys-body { font-size: 12px; color: #6B6A66; line-height: 1.5; }
.sys .sys-actions { display: flex; gap: 8px; margin-top: 2px; }
.sys .sys-btn {
  font-size: 12px; border: none; border-radius: 8px; padding: 5px 12px;
  cursor: pointer; font-family: inherit; transition: background 0.15s;
}
.sys .sys-btn.primary { background: #185FA5; color: #fff; }
.sys .sys-btn.primary:hover { background: #15508C; }
.sys .sys-btn.ghost { background: rgba(0,0,0,0.05); color: #5F5E5A; }
.sys .sys-btn.ghost:hover { background: rgba(0,0,0,0.1); }
.sys .sys-pin { font-size: 11px; color: #9A9893; line-height: 1.4; }

/* ── 空态 ── */
.empty {
  height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #B0AEA8; gap: 6px; font-size: 13px;
}
.empty svg { opacity: 0.45; }

/* 整窗入场：仅「隐藏→可见」时由 nc-show 触发 */
@keyframes ncSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
#app.nc-enter { animation: ncSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <img src="../assets/icon.png" class="header-icon" onerror="this.style.display='none'" />
    <span class="title">消息通知</span>
    <span class="badge" id="badge" style="display:none;">0</span>
    <span class="spacer"></span>
    <button class="btn close" id="btn-close" title="关闭">✕</button>
  </div>
  <div class="list" id="list"></div>
</div>
<audio id="nc-audio" style="display:none;"></audio>

<script>
(function () {
  var api = window.electronAPI
  if (!api) {
    document.body.innerHTML = '<div style="color:red;padding:20px;">Error: electronAPI not available</div>'
    return
  }

  var settings = {}
  var unread = []            // 主进程已排好序（索引 0 = 最上面），渲染层**不排序**
  var sysList = []           // 系统卡数组（主进程已排序）
  var focusId = null
  var rowMap = {}            // cid -> { el, parts, avatar }
  var sysRowMap = {}         // aid -> { el, sig }
  var audioEl = document.getElementById('nc-audio')
  var listEl = document.getElementById('list')
  var badgeEl = document.getElementById('badge')
  var appEl = document.getElementById('app')
  var MIN_H = 132, MAX_H = 520
  var lastSentH = 0
  var lastLoggedSig = ''

  // 渲染层日志回传：渲染进程的异常在主进程里完全看不到，必须送回主进程落盘
  // （%APPDATA%\mylog-desktop-notifier\logs\notify-*.log，前缀 [NCR]）
  function ncLog(s) {
    try { if (api && api.ncLog) api.ncLog(s) } catch (e) {}
  }
  window.onerror = function (m, src, line, col, err) {
    ncLog('JS_ERROR ' + m + ' @' + line + ':' + col +
      (err && err.stack ? ' | ' + String(err.stack).split('\n').slice(0, 3).join(' ') : ''))
    return false
  }
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason
    ncLog('UNHANDLED ' + (r && r.message ? r.message : String(r)))
  })

  var EMPTY_HTML = '<div class="empty"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B0AEA8" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div>暂无新通知</div></div>'

  function fmtTime(ts) {
    var d = new Date(ts || Date.now())
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  function applyDisplayMode() {
    var mode = (settings.messageNotify && settings.messageNotify.display) || 'content'
    if (mode === 'count') document.body.classList.add('nc-hide-content')
    else document.body.classList.remove('nc-hide-content')
  }

  // ── 结构（只建一次，后续全部原地更新） ──
  function ensureSections() {
    if (document.getElementById('sec-sys')) return
    listEl.innerHTML =
      '<div id="title-sys" class="section-title">系统通知</div><div id="sec-sys"></div>' +
      '<div id="title-conv" class="section-title">会话</div><div id="sec-conv"></div>'
  }

  function dropAll() {
    rowMap = {}
    sysRowMap = {}
    listEl.innerHTML = ''
  }

  function placeIn(wrap, el, idx) {
    if (!wrap || !el || el.nodeType !== 1) return
    var cur = wrap.children[idx]
    if (cur === el) return
    wrap.insertBefore(el, cur || null)
  }

  function trimTo(wrap, n) {
    while (wrap.children.length > n) wrap.removeChild(wrap.lastElementChild)
  }

  // ── 会话行 ──
  function ensureConvRow(it) {
    var cid = it.conversationId
    var rec = rowMap[cid]
    if (rec) return rec
    var el = document.createElement('div')
    el.className = 'conv is-new'
    el.setAttribute('data-id', encodeURIComponent(cid))
    el.innerHTML =
      '<div class="avatar"><span class="afb"></span><img alt=""></div>' +
      '<div class="body"><div class="row1"><span class="name"></span><span class="time"></span></div>' +
      '<div class="last"></div></div><span class="count"></span>'
    rec = {
      el: el,
      fresh: true,              // 新建行：渲染后要把列表滚回顶部，保证最新会话可见
      avatar: '\u0000',         // 哨兵：保证首帧一定会写一次
      parts: {
        av: el.querySelector('.avatar'),
        fb: el.querySelector('.afb'),
        img: el.querySelector('.avatar img'),
        name: el.querySelector('.name'),
        time: el.querySelector('.time'),
        last: el.querySelector('.last'),
        count: el.querySelector('.count')
      }
    }
    rowMap[cid] = rec
    return rec
  }

  function setText(el, v) { if (el && el.textContent !== v) el.textContent = v }
  function setDisplay(el, v) { if (el && el.style.display !== v) el.style.display = v }

  function updateConvRow(rec, it) {
    var p = rec.parts

    var av = it.avatar || ''
    if (rec.avatar !== av) {
      rec.avatar = av
      if (av) {
        // 先等图片真正解码完成再显示，避免 "白块 → 头像" 闪一下（S1.9）
        p.img.onload = function () { p.av.classList.add('has-img') }
        p.img.onerror = function () { p.av.classList.remove('has-img') }
        p.img.src = av
      } else {
        p.img.removeAttribute('src')
        p.av.classList.remove('has-img')
      }
    }
    setText(p.fb, (it.name || '?').charAt(0))
    setText(p.name, it.name || '未知用户')
    setText(p.time, fmtTime(it.time))

    var last = String(it.last || '')
    if (last.length > 40) last = last.slice(0, 40) + '...'
    setText(p.last, last)

    var c = it.count || 0
    var cs = c > 99 ? '99+' : (c > 0 ? String(c) : '')
    setText(p.count, cs)
    var disp = cs ? '' : 'none'
    if (p.count.style.display !== disp) p.count.style.display = disp

    var url = it.url || ''
    if (rec.el.getAttribute('data-url') !== encodeURIComponent(url)) {
      rec.el.setAttribute('data-url', encodeURIComponent(url))
    }
    var on = !!(focusId && it.conversationId === focusId)
    if (rec.el.classList.contains('is-focus') !== on) rec.el.classList.toggle('is-focus', on)
  }

  // ── 系统卡 ──
  function sysCardHtml(a) {
    if (a.type === 'kick') {
      var d = a.data || {}
      return '<div class="sys kick" data-id="' + escapeHtml(a.id) + '">' +
        '<div class="sys-title">⚠ 您已在其他设备登录</div>' +
        '<div class="sys-body">您的账号于 ' + fmtTime(d.time || Date.now()) + ' 在 ' +
        escapeHtml(d.device || '其他设备') + ' 登录，当前会话已结束。</div>' +
        '<div class="sys-pin">🔒 常驻提醒：重连上线或点「知道了」后才会消失</div>' +
        '<div class="sys-actions">' +
          '<button class="sys-btn primary" data-act="reconnect">重新登录</button>' +
          '<button class="sys-btn ghost" data-act="dismiss">知道了</button>' +
        '</div></div>'
    }
    if (a.type === 'offline') {
      return '<div class="sys offline" data-id="' + escapeHtml(a.id) + '">' +
        '<div class="sys-title">⚡ 网络已断开</div>' +
        '<div class="sys-body">消息可能无法实时接收，正在尝试重连…</div>' +
        '<div class="sys-pin">🔒 常驻提醒：恢复连接或点「关闭」后才会消失</div>' +
        '<div class="sys-actions"><button class="sys-btn ghost" data-act="dismiss">关闭</button></div>' +
        '</div>'
    }
    return ''
  }

  // ── 主渲染 ──
  function render() {
    var total = unread.reduce(function (s, it) { return s + (it.count || 0) }, 0)
    if (total > 0) {
      setDisplay(badgeEl, '')
      setText(badgeEl, total > 99 ? '99+' : String(total))
    } else {
      setDisplay(badgeEl, 'none')
    }

    if (!unread.length && !sysList.length) {
      if (listEl.getAttribute('data-empty') !== '1') {
        dropAll()
        listEl.setAttribute('data-empty', '1')
        listEl.innerHTML = EMPTY_HTML
      }
      measure(false)
      return
    }
    if (listEl.hasAttribute('data-empty')) listEl.removeAttribute('data-empty')
    ensureSections()

    var secSys = document.getElementById('sec-sys')
    var titleSys = document.getElementById('title-sys')
    var secConv = document.getElementById('sec-conv')
    var titleConv = document.getElementById('title-conv')

    // 系统卡（固定在最上面，S4.5）
    var i, keepSys = {}
    for (i = 0; i < sysList.length; i++) {
      var a = sysList[i]
      keepSys[a.id] = 1
      var html = sysCardHtml(a)
      if (!html) continue
      var sig = a.type + '|' + JSON.stringify(a.data || {})
      var rec = sysRowMap[a.id]
      if (!rec) {
        var box = document.createElement('div')
        box.innerHTML = html
        var el = box.firstElementChild
        if (!el) continue
        rec = { el: el, sig: sig }
        sysRowMap[a.id] = rec
        secSys.appendChild(el)
      } else if (rec.sig !== sig) {
        var box2 = document.createElement('div')
        box2.innerHTML = html
        var el2 = box2.firstElementChild
        if (el2) { secSys.replaceChild(el2, rec.el); rec.el = el2; rec.sig = sig }
      }
      placeIn(secSys, rec.el, i)
    }
    Object.keys(sysRowMap).forEach(function (id) {
      if (!keepSys[id]) {
        var r = sysRowMap[id]
        if (r && r.el.parentNode) r.el.parentNode.removeChild(r.el)
        delete sysRowMap[id]
      }
    })
    trimTo(secSys, Object.keys(keepSys).length)
    setDisplay(titleSys, sysList.length ? '' : 'none')

    // 会话行：严格按主进程给的顺序，不排序（排序会造成整列跳动）
    var keepConv = {}
    var addedConv = false
    for (i = 0; i < unread.length; i++) {
      var it = unread[i]
      if (!it || !it.conversationId) continue
      keepConv[it.conversationId] = 1
      var r2 = ensureConvRow(it)
      if (r2.fresh) { r2.fresh = false; addedConv = true }
      updateConvRow(r2, it)
      placeIn(secConv, r2.el, i)
    }
    Object.keys(rowMap).forEach(function (cid) {
      if (!keepConv[cid]) {
        var rr = rowMap[cid]
        if (rr && rr.el.parentNode) rr.el.parentNode.removeChild(rr.el)
        delete rowMap[cid]
      }
    })
    trimTo(secConv, unread.length)
    setDisplay(titleConv, unread.length ? '' : 'none')

    // 有新会话进来时滚回顶部：提醒窗是被动接收的，最新一条必须可见（S1.6）。
    // 已有行更新不滚（否则用户正在看的内容被抢走）。
    if (addedConv && listEl.scrollTop > 0) listEl.scrollTop = 0

    var sig = unread.length + '/' + sysList.length
    if (sig !== lastLoggedSig) {
      lastLoggedSig = sig
      ncLog('render rows=' + unread.length + ' sys=' + sysList.length)
    }

    measure(false)
  }

  // 实测高度：唯一可信来源（I4）。force=true 时即使没变化也回传（响应 nc-measure）。
  function measure(force) {
    var header = document.querySelector('.header')
    var headerH = header ? header.offsetHeight : 48
    var contentH = listEl ? listEl.scrollHeight : 0
    var h = Math.max(MIN_H, Math.min(MAX_H, headerH + contentH))
    if (!force && h === lastSentH) return
    lastSentH = h
    ncLog('measure h=' + h + ' header=' + headerH + ' content=' + contentH + (force ? ' (force)' : ''))
    try { api.resizeNc(h) } catch (e) { ncLog('resizeNc FAILED ' + e.message) }
  }

  // ── 事件 ──
  api.onNcState(function (data) {
    data = data || {}
    ncLog('nc-state recv unread=' + ((data.unread || []).length) + ' sys=' + ((data.sysAlerts || []).length) + ' phase=' + (data.phase || '?'))
    settings = data.settings || {}
    focusId = data.focusId || null
    unread = (data.unread || []).filter(function (it) { return !!(it && it.conversationId) })
    sysList = data.sysAlerts || []
    applyDisplayMode()
    render()
  })

  api.onNcMeasure(function () { ncLog('nc-measure recv'); measure(true) })

  api.onNcPlay(function (data) {
    var p = data && data.path
    if (!p) return
    try {
      audioEl.src = p
      audioEl.loop = false
      audioEl.volume = 0.7
      audioEl.play().catch(function () {})
    } catch (e) {}
  })

  // 整窗入场动画：仅「隐藏→可见」时播放
  function playEnter() {
    appEl.classList.remove('nc-enter')
    void appEl.offsetWidth
    appEl.classList.add('nc-enter')
    if (listEl) listEl.scrollTop = 0
  }
  api.onNcShow(playEnter)
  appEl.addEventListener('animationend', function (e) {
    if (e.animationName === 'ncSlideUp') appEl.classList.remove('nc-enter')
  })
  // 行级动画结束后移除 class（避免下次重复播放）
  listEl.addEventListener('animationend', function (e) {
    if (e.animationName === 'ncRowIn' && e.target && e.target.classList) {
      e.target.classList.remove('is-new')
    }
  })

  // ── 点击 ──
  listEl.addEventListener('click', function (e) {
    var sysBtn = e.target.closest('.sys-btn')
    if (sysBtn) {
      var card = sysBtn.closest('.sys')
      var sid = card && card.getAttribute('data-id')
      var act = sysBtn.getAttribute('data-act')
      if (act === 'reconnect') {
        api.reconnect()
        if (sid) api.dismissSysAlert(sid)
      } else if (act === 'dismiss' && sid) {
        api.dismissSysAlert(sid)
      }
      return
    }
    var conv = e.target.closest('.conv')
    if (conv) {
      var cid = decodeURIComponent(conv.getAttribute('data-id') || '')
      var url = decodeURIComponent(conv.getAttribute('data-url') || '')
      api.openConversation(cid, url)
    }
  })

  document.getElementById('btn-close').addEventListener('click', function () {
    api.closeNc(true)
  })
})()
</script>
</body>
</html>
