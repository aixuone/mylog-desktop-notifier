<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>我的日志</title>
<style>
@font-face {
  font-family: 'System UI';
  src: local('Microsoft YaHei UI'), local('Microsoft YaHei'),
       local('PingFang SC'), local('PingFang HK'),
       local('Noto Sans CJK SC'), local('SimHei'),
       local(system-ui), local(sans-serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'System UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #F5F6F8;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; user-select: none;
  -webkit-font-smoothing: antialiased;
}
.logo {
  width: 64px; height: 64px; border-radius: 16px;
  background: linear-gradient(135deg, #185FA5, #378ADD);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(24,95,165,0.28);
}
.logo svg { width: 34px; height: 34px; }
.title { font-size: 18px; font-weight: 600; color: #2C2C2A; letter-spacing: 1px; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid #D8D5CF; border-top-color: #185FA5;
  animation: spin 0.8s linear infinite;
}
.tip { font-size: 12px; color: #9A9893; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="title">我的日志</div>
  <div class="spinner"></div>
  <div class="tip">正在加载工作台…</div>
</body>
</html>
