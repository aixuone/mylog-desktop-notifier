<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>e日志</title>
<style>
@font-face {
  font-family: 'System UI';
  src: local('Microsoft YaHei UI'), local('Microsoft YaHei'),
       local('PingFang SC'), local('PingFang HK'),
       local('Noto Sans CJK SC'), local('SimHei'),
       local(system-ui), local(sans-serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'System UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: #F5F6F8;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; user-select: none;
  -webkit-font-smoothing: antialiased;
}
.logo {
  width: 88px; height: 88px;
  display: flex; align-items: center; justify-content: center;
}
.logo img {
  width: 88px; height: 88px; display: block;
  border-radius: 18px;
  box-shadow: 0 6px 20px rgba(24,95,165,0.18);
}
.title { font-size: 18px; font-weight: 600; color: #2C2C2A; letter-spacing: 1px; }
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 3px solid #D8D5CF; border-top-color: #185FA5;
  animation: spin 0.8s linear infinite;
}
.tip { font-size: 12px; color: #9A9893; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">
    <img src="../assets/icon.png" alt="e日志" onerror="this.style.display='none'">
  </div>
  <div class="title">e日志</div>
  <div class="spinner"></div>
  <div class="tip">正在加载…</div>
</body>
</html>
