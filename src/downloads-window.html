<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>下载中心 · e日志</title>
<style>
@font-face {
  font-family: 'System UI';
  src: local('Microsoft YaHei UI'), local('Microsoft YaHei'),
       local('PingFang SC'), local('PingFang HK'),
       local('Noto Sans CJK SC'), local('SimHei'),
       local(system-ui), local(sans-serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --brand: #185FA5;
  --brand-soft: rgba(24,95,165,.10);
  --brand-soft2: rgba(24,95,165,.06);
  --green: #16A34A;
  --red: #DC2626;
  --ink: #2C2C2A;
  --ink-2: #6B6864;
  --ink-3: #9A9893;
  --ink-4: #A5A29C;
  --line: rgba(24,95,165,0.10);
  --line-2: rgba(24,95,165,0.06);
  --card: rgba(255,255,255,0.72);
  --card-line: rgba(255,255,255,0.85);
}

body {
  font-family: 'System UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: var(--ink); height: 100vh; overflow: hidden;
  background:
    radial-gradient(520px 300px at 100% 0%, rgba(24,95,165,0.13), transparent 60%),
    radial-gradient(420px 260px at 0% 100%, rgba(255,149,0,0.10), transparent 55%),
    linear-gradient(160deg, #FBFCFE 0%, #F2F5FA 100%);
  -webkit-font-smoothing: antialiased;
  border: 1px solid rgba(24,95,165,0.18);
  border-radius: 12px;
  user-select: none;
}

/* ── 标题栏（可拖拽） ── */
.titlebar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 10px 0 14px;
  -webkit-app-region: drag;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
}
.titlebar .logo { display: flex; align-items: center; color: var(--brand); }
.titlebar .title { font-size: 13px; font-weight: 700; letter-spacing: .3px; }
.titlebar .count { font-size: 11px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.titlebar .who {
  -webkit-app-region: no-drag;
  margin-left: auto;
  font-size: 11px; color: var(--brand); font-weight: 600; white-space: nowrap;
  background: var(--brand-soft); padding: 2px 9px; border-radius: 9px;
}
.titlebar .close {
  -webkit-app-region: no-drag;
  width: 26px; height: 26px; border: none; border-radius: 7px;
  background: transparent; color: var(--ink-3); font-size: 14px; cursor: pointer;
  line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.titlebar .close:hover { background: rgba(220,38,38,.12); color: var(--red); }

/* ── 状态筛选 Tab ── */
.tabs {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 12px; border-bottom: 1px solid var(--line-2);
}
.tabs .tab {
  -webkit-app-region: no-drag;
  border: none; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 11.5px; color: var(--ink-2);
  padding: 4px 10px; border-radius: 999px; line-height: 1.3;
  transition: background .15s, color .15s;
}
.tabs .tab:hover { background: rgba(24,95,165,.06); color: var(--brand); }
.tabs .tab.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.tabs .tab .n { font-weight: 500; opacity: .75; margin-left: 2px; }

/* ── 列表 ── */
.list { height: calc(100vh - 126px); overflow-y: auto; padding: 8px 10px; }
.list::-webkit-scrollbar { width: 8px; }
.list::-webkit-scrollbar-thumb { background: rgba(24,95,165,.18); border-radius: 4px; }
.list::-webkit-scrollbar-thumb:hover { background: rgba(24,95,165,.30); }
.list::-webkit-scrollbar-track { background: transparent; }
.item {
  display: flex; align-items: center; gap: 10px;
  background: var(--card);
  border: 1px solid var(--card-line);
  box-shadow: 0 4px 14px rgba(31,45,61,0.06);
  border-radius: 11px; padding: 9px 10px; margin-bottom: 8px;
  transition: border-color .14s ease, background .14s ease, box-shadow .14s ease;
}
.item:hover {
  background: rgba(255,255,255,0.92);
  border-color: rgba(24,95,165,0.22);
  box-shadow: 0 6px 16px rgba(31,45,61,0.09);
}
/* 文件类型图标：按扩展名着色 */
.item .icon {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 9px; font-size: 9.5px; font-weight: 700; letter-spacing: .2px;
}
.t-amber { background: rgba(133,79,11,.10); color: #854F0B; }
.t-red   { background: rgba(220,38,38,.10); color: #B91C1C; }
.t-blue  { background: rgba(24,95,165,.10); color: #185FA5; }
.t-teal  { background: rgba(15,110,86,.10); color: #0F6E56; }
.t-purple{ background: rgba(83,74,183,.10); color: #534AB7; }
.t-pink  { background: rgba(153,53,86,.10); color: #993556; }
.t-gray  { background: rgba(44,44,42,.08); color: #6B6864; }
.t-green { background: rgba(22,163,74,.12); color: #16A34A; }

.item .body { flex: 1; min-width: 0; }
.item .fname {
  font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
  text-decoration: none; /* 防止删除线误伤子徽标 */
}
.item .fname .badge {
  flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 1.5px 7px; border-radius: 8px;
  text-decoration: none;
}
.badge.fail { background: rgba(220,38,38,.12); color: var(--red); }
.item .meta { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.item .meta .st-go { color: var(--brand); font-weight: 600; }
.item .meta .st-fail { color: var(--red); font-weight: 600; }
.item .meta .st-done { color: var(--ink-3); }
/* 进度条：仅下载中显示 */
.pbar { height: 3px; border-radius: 2px; background: #E7E5E0; margin-top: 6px; overflow: hidden; }
.pbar > i {
  display: block; height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #185FA5, #2F7FD0);
  background-image: linear-gradient(45deg, rgba(255,255,255,.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.25) 50%, rgba(255,255,255,.25) 75%, transparent 75%, transparent), linear-gradient(90deg, #185FA5, #2F7FD0);
  background-size: 16px 16px, 100% 100%;
  animation: pstripe 1s linear infinite;
  transition: width .3s;
}
@keyframes pstripe { from { background-position: 0 0, 0 0; } to { background-position: 16px 0, 0 0; } }
/* blob 下载（页面内存里生成的导出包）：没有分段字节，用流动条表达「正在保存」 */
.pbar.indet > i {
  width: 34%;
  background: linear-gradient(90deg, rgba(24,95,165,.12), #185FA5 40%, #2F7FD0 60%, rgba(24,95,165,.12));
  animation: pindet 1.2s ease-in-out infinite;
}
@keyframes pindet { 0% { transform: translateX(-110%); } 100% { transform: translateX(310%); } }

/* 操作按钮：ghost 风格，hover 才浮现边框 */
.ops { display: flex; gap: 3px; flex-shrink: 0; align-items: center; }
.ops button {
  border: 1px solid transparent; background: transparent; color: var(--ink-3);
  font-family: inherit; padding: 0; width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s, transform .1s;
  display: inline-flex; align-items: center; justify-content: center;
}
.item:hover .ops button { color: var(--ink-2); }
.ops button:hover { border-color: rgba(24,95,165,.25); color: var(--brand); background: var(--brand-soft2); }
.ops button:active { transform: scale(.92); }
.ops button.danger:hover { border-color: rgba(220,38,38,.25); color: var(--red); background: rgba(220,38,38,.06); }
.ops button:disabled { opacity: .45; cursor: not-allowed; }
/* 胶囊按钮（重试 / 重新下载） */
.ops .pill {
  width: auto; height: 24px; padding: 0 11px; border-radius: 999px;
  border: 1px solid rgba(24,95,165,.30); color: var(--brand); font-size: 11.5px; font-weight: 600;
  background: rgba(255,255,255,.7);
}
.ops .pill:hover { border-color: var(--brand); background: var(--brand-soft2); }

/* 空状态 */
.empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--ink-4); font-size: 12.5px; text-align: center; padding: 0 30px;
}
.empty .big {
  width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
  background: rgba(24,95,165,.06); color: var(--brand); margin-bottom: 4px;
}
.empty .sub { font-size: 11px; color: var(--ink-4); opacity: .85; max-width: 240px; }

/* ── 底部工具栏：下载位置 + 更改 + 清空已完成（单条收拢） ── */
.bottombar {
  height: 44px; display: flex; align-items: center; gap: 7px;
  padding: 0 12px; border-top: 1px solid var(--line);
  background: rgba(255,255,255,0.35);
}
.bottombar .pico { color: var(--brand); display: flex; align-items: center; flex-shrink: 0; }
.bottombar .val {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums;
}
.bottombar button {
  flex-shrink: 0; border: 1px solid #D8D5CF; background: #fff; color: var(--ink);
  font-family: inherit; font-size: 11.5px; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
}
.bottombar button:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); background: var(--brand-soft2); box-shadow: 0 2px 8px rgba(24,95,165,.12); }
.bottombar button:disabled { opacity: .4; cursor: not-allowed; }
.bottombar button.muted { border-color: transparent; background: transparent; color: var(--ink-3); }
.bottombar button.muted:hover:not(:disabled) { color: var(--red); border-color: rgba(220,38,38,.25); background: rgba(220,38,38,.06); box-shadow: none; }

/* ── 已不可访问的下载项（文件被移动/删除）── */
.item.inaccessible { opacity: .6; background: rgba(245,245,244,0.7); }
.item.inaccessible .icon,
.item.inaccessible .meta { filter: grayscale(1); opacity: .8; }
.item.inaccessible .fname { text-decoration: line-through; text-decoration-color: #C0BDB8; color: var(--ink-3); }
.item.inaccessible .fname .badge,
.item.inaccessible .fname .inac { text-decoration: none; }
.item.inaccessible .inac {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; padding: 1.5px 7px; border-radius: 8px;
  background: rgba(220,38,38,.12); color: var(--red); margin-left: 6px;
}

/* 操作结果提示（打开文件/所在目录等失败反馈，避免“点了没反应”） */
.toast {
  position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%) translateY(8px);
  max-width: 320px; padding: 9px 14px; border-radius: 10px;
  background: rgba(30,32,38,0.92); color: #fff; font-size: 12px; line-height: 1.45;
  box-shadow: 0 8px 28px rgba(0,0,0,.24); opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 9; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: rgba(185,28,28,0.95); }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
    <span class="title">下载中心</span>
    <span class="count" id="dl-count"></span>
    <span class="who" id="dl-who"></span>
    <button class="close" id="btn-close" title="关闭">✕</button>
  </div>

  <div class="tabs" id="dl-tabs"></div>

  <div class="list" id="dl-list"></div>

  <div class="bottombar">
    <span class="pico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
    <span class="val" id="dl-path-val" title=""></span>
    <button id="btn-path" title="更改下载保存位置">更改</button>
    <button id="btn-clear" class="muted" title="移除所有已完成/失败/已取消的记录（下载记录按当前账号隔离保存）">清空已完成</button>
  </div>

  <div id="dl-toast" class="toast"></div>

<script>
;(function () {
  var api = window.electronAPI || {}
  var listEl = document.getElementById('dl-list')
  var tabsEl = document.getElementById('dl-tabs')
  var countEl = document.getElementById('dl-count')
  var whoEl = document.getElementById('dl-who')
  var clearBtn = document.getElementById('btn-clear')
  var closeBtn = document.getElementById('btn-close')
  var toastEl = document.getElementById('dl-toast')
  var pathVal = document.getElementById('dl-path-val')
  var pathBtn = document.getElementById('btn-path')
  var toastTimer = null
  var currentTab = 'all'       // all | going | done | fail
  var lastList = []            // 最近一次全量数据（Tab 切换用）
  var speedMap = {}            // id -> { t, bytes, speed } 渲染层增量测速
  function showToast(msg, isErr) {
    if (!toastEl) return
    toastEl.textContent = msg
    toastEl.className = 'toast show' + (isErr ? ' err' : '')
    if (toastTimer) clearTimeout(toastTimer)
    toastTimer = setTimeout(function () { toastEl.className = 'toast' }, 2600)
  }
  function setPath(p) {
    if (!pathVal) return
    pathVal.textContent = p || ''
    pathVal.title = p || ''
  }

  // 当前账号标识：下载记录按用户隔离，标题处展示归属账号
  function setUser(u) {
    whoEl.textContent = (u && u.userName) ? u.userName : ''
  }

  // ── 文件类型图标：扩展名 → 着色徽标 ──
  var EXT_MAP = {
    zip: 't-amber', rar: 't-amber', '7z': 't-amber', gz: 't-amber', tar: 't-amber',
    pdf: 't-red',
    html: 't-blue', htm: 't-blue', css: 't-blue', url: 't-blue',
    md: 't-teal', txt: 't-teal', doc: 't-teal', docx: 't-teal', xls: 't-teal', xlsx: 't-teal', ppt: 't-teal', pptx: 't-teal', csv: 't-teal',
    js: 't-purple', ts: 't-purple', json: 't-purple', py: 't-purple', java: 't-purple',
    png: 't-pink', jpg: 't-pink', jpeg: 't-pink', gif: 't-pink', webp: 't-pink', svg: 't-pink', bmp: 't-pink',
    log: 't-gray',
    mp3: 't-green', mp4: 't-green', wav: 't-green', avi: 't-green', mov: 't-green', m4a: 't-green',
  }
  function extOf(name) {
    var m = /\.([A-Za-z0-9]+)$/.exec(name || '')
    return m ? m[1].toLowerCase() : ''
  }
  function typeIcon(name) {
    var ext = extOf(name)
    var label = (ext || 'file').slice(0, 4).toUpperCase()
    return '<span class="icon ' + (EXT_MAP[ext] || 't-blue') + '">' + escapeHtml(label) + '</span>'
  }

  // 操作按钮图标（stroke 风格 SVG，currentColor 继承）
  var BTN = {
    cancel: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 L18 18 M6 18 L18 6"/></svg>',
    open: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="12" y2="18"/><polyline points="9 15 12 12 15 15"/></svg>',
    folder: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
    browser: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  }
  function fmtBytes(n) {
    if (!n || n <= 0) return ''
    var u = ['B', 'KB', 'MB', 'GB'], i = 0
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ }
    return (i ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]
  }
  function fmtSize(d) {
    var r = fmtBytes(d.receivedBytes), t = fmtBytes(d.totalBytes)
    if (!r && !t) return ''
    return (r || '?') + (t ? ' / ' + t : '')
  }
  function pct(d) {
    if (d.state !== 'progressing' || !d.totalBytes) return 100
    return Math.min(100, Math.round((d.receivedBytes / d.totalBytes) * 100))
  }
  // 增量测速：两次广播间隔 ≥800ms 才刷新，避免抖动；非进行态清栈
  function speedOf(d) {
    if (d.state !== 'progressing') { delete speedMap[d.id]; return 0 }
    var now = Date.now(), m = speedMap[d.id]
    if (!m) { speedMap[d.id] = { t: now, bytes: d.receivedBytes, speed: 0 }; return 0 }
    if (now - m.t >= 800) {
      var sp = (d.receivedBytes - m.bytes) / ((now - m.t) / 1000)
      if (sp >= 0) m.speed = sp
      m.t = now; m.bytes = d.receivedBytes
    }
    return m.speed || 0
  }
  function fmtSpeed(d) {
    var s = speedOf(d)
    if (s < 1) return ''
    return ' · ' + (s >= 1024 * 1024 ? (s / 1024 / 1024).toFixed(1) + ' MB/s' : Math.round(s / 1024) + ' KB/s')
  }
  // 开始时间：今天→HH:mm，昨天→「昨天 HH:mm」，更早→MM-DD
  function fmtTime(d) {
    if (!d.startedAt) return ''
    var t = new Date(d.startedAt), now = new Date()
    function p(n) { return (n < 10 ? '0' : '') + n }
    var hm = p(t.getHours()) + ':' + p(t.getMinutes())
    var day = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()
    var that = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime()
    var diff = Math.round((day - that) / 86400000)
    if (diff === 0) return '今天 ' + hm
    if (diff === 1) return '昨天 ' + hm
    return p(t.getMonth() + 1) + '-' + p(t.getDate()) + ' ' + hm
  }

  function tabCounts(list) {
    return {
      all: list.length,
      going: list.filter(function (d) { return d.state === 'progressing' }).length,
      done: list.filter(function (d) { return d.state === 'completed' }).length,
      fail: list.filter(function (d) { return d.state === 'interrupted' || d.state === 'cancelled' }).length,
    }
  }
  function renderTabs() {
    var c = tabCounts(lastList)
    var defs = [
      ['all', '全部', c.all], ['going', '进行中', c.going],
      ['done', '已完成', c.done], ['fail', '失败', c.fail],
    ]
    tabsEl.innerHTML = defs.map(function (t) {
      return '<button class="tab' + (currentTab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' +
        t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>'
    }).join('')
  }
  tabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]')
    if (!btn) return
    currentTab = btn.getAttribute('data-tab')
    renderTabs()
    renderList()
  })

  function render(list) {
    list = list || []
    lastList = list
    var active = tabCounts(list).going
    countEl.textContent = list.length ? ('共 ' + list.length + ' 个任务' + (active ? ' · ' + active + ' 个进行中' : '')) : ''
    renderTabs()
    renderList()
    var hasFinished = list.some(function (d) { return d.state !== 'progressing' })
    clearBtn.disabled = !hasFinished
  }

  function renderList() {
    var list = lastList
    if (!list.length) {
      listEl.innerHTML =
        '<div class="empty"><span class="big"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>' +
        '<span>暂无下载任务</span>' +
        '<span class="sub">在网页里点击附件 / 文件链接即可下载到这里</span></div>'
      return
    }
    var filtered = list
    if (currentTab === 'going') filtered = list.filter(function (d) { return d.state === 'progressing' })
    else if (currentTab === 'done') filtered = list.filter(function (d) { return d.state === 'completed' })
    else if (currentTab === 'fail') filtered = list.filter(function (d) { return d.state === 'interrupted' || d.state === 'cancelled' })
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty"><span>该分类下暂无任务</span></div>'
      return
    }

    listEl.innerHTML = filtered.map(function (d) {
      var isGoing = d.state === 'progressing'
      var doneOk = d.state === 'completed'
      var fail = d.state === 'interrupted'
      var cancelled = d.state === 'cancelled'
      var inac = !!d.inaccessible
      var meta = ''
      var bar = ''
      // blob: 下载＝页面用内存 Blob 生成的导出包，Electron 不会上报分段字节（0 → 满 一次跳变），
      // 因此不显示百分比，改「保存中…」+ 流动条，避免 0% 静止条让人误以为卡住。
      var isBlob = /^blob:/i.test(d.url || '')
      if (isGoing) {
        if (isBlob) {
          meta = '<span class="st-go">保存中…</span>' + (d.totalBytes ? ' · ' + fmtBytes(d.totalBytes) : '')
          bar = '<div class="pbar indet"><i></i></div>'
        } else {
          meta = '<span class="st-go">' + pct(d) + '%</span>' + fmtSpeed(d) + (fmtSize(d) ? ' · ' + fmtSize(d) : '')
          bar = '<div class="pbar"><i style="width:' + pct(d) + '%"></i></div>'
        }
      } else if (fail) {
        meta = '<span class="st-fail">失败</span>' + (fmtSize(d) ? ' · ' + fmtSize(d) : '') + (fmtTime(d) ? ' · ' + fmtTime(d) : '')
      } else if (cancelled) {
        meta = '<span class="st-fail">已取消</span>' + (fmtSize(d) ? ' · ' + fmtSize(d) : '') + (fmtTime(d) ? ' · ' + fmtTime(d) : '')
      } else if (doneOk) {
        meta = '<span class="st-done">完成</span>' + (fmtSize(d) ? ' · ' + fmtSize(d) : '') + (fmtTime(d) ? ' · ' + fmtTime(d) : '')
      } else {
        meta = fmtSize(d)
      }
      if (inac) meta += ' · 文件已不可访问'
      var ops = '<div class="ops">'
      if (inac) {
        // 已不可访问：隐藏「打开文件 / 打开文件所在文件夹」，仅保留浏览器重新下载
        ops += '<button data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">' + BTN.browser + '</button>'
      } else if (isGoing) {
        ops += '<button data-act="cancel" data-id="' + d.id + '" class="danger" title="取消本次下载">' + BTN.cancel + '</button>'
      } else if (doneOk) {
        ops += '<button data-act="open" data-id="' + d.id + '" title="打开文件">' + BTN.open + '</button>' +
               '<button data-act="folder" data-id="' + d.id + '" title="打开文件所在文件夹">' + BTN.folder + '</button>' +
               '<button data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">' + BTN.browser + '</button>'
      } else if (fail) {
        ops += '<button class="pill" data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">重试</button>' +
               '<button data-act="folder" data-id="' + d.id + '" title="打开文件所在文件夹">' + BTN.folder + '</button>'
      } else if (cancelled) {
        ops += '<button class="pill" data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">重新下载</button>'
      }
      ops += '</div>'
      return '<div class="item' + (inac ? ' inaccessible' : '') + '">' +
        typeIcon(d.filename) +
        '<div class="body">' +
          '<div class="fname">' + escapeHtml(d.filename || '未知文件') + (fail ? BADGE_FAIL : '') + (inac ? '<span class="inac">不可访问</span>' : '') + '</div>' +
          '<div class="meta">' + meta + '</div>' + bar +
        '</div>' + ops + '</div>'
    }).join('')
  }
  var BADGE_FAIL = '<span class="badge fail">失败</span>'

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  // 文件被标记为「不可访问」后，主动重新拉取列表并重渲染，确保置灰 + 删除线必定出现
  function refetchAfterInaccessible() {
    if (api.downloadsList) { api.downloadsList().then(render).catch(function () {}) }
  }
  // 事件委托：按钮
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button')
    if (!btn) return
    var id = btn.getAttribute('data-id')
    var act = btn.getAttribute('data-act')
    if (act === 'open' && api.downloadsOpen) {
      Promise.resolve(api.downloadsOpen(id)).then(function (r) {
        if (r && r.inaccessible) refetchAfterInaccessible()
        if (r && r.ok === false) showToast(r.reason || '打开失败', true)
      }).catch(function () { showToast('打开失败', true) })
    }
    else if (act === 'folder' && api.downloadsOpenFolder) {
      Promise.resolve(api.downloadsOpenFolder(id)).then(function (r) {
        if (r && r.inaccessible) refetchAfterInaccessible()
        if (r && r.ok === false) showToast(r.reason || '打开所在目录失败', true)
        else if (r && r.note) showToast(r.note, false)
      }).catch(function () { showToast('打开所在目录失败', true) })
    }
    else if (act === 'browser' && api.downloadsOpenInBrowser) {
      Promise.resolve(api.downloadsOpenInBrowser(id)).then(function (r) {
        if (r && r.ok === false) showToast(r.reason || '浏览器打开失败', true)
      }).catch(function () { showToast('浏览器打开失败', true) })
    }
    else if (act === 'cancel' && api.downloadsCancel) { btn.disabled = true; api.downloadsCancel(id) }
  })
  clearBtn.addEventListener('click', function () { if (api.downloadsClear) api.downloadsClear() })
  closeBtn.addEventListener('click', function () { window.close() })
  // 更改下载位置：弹出文件夹选择器保存，并刷新展示
  if (pathBtn) pathBtn.addEventListener('click', function () {
    if (!api.downloadsPickDir) { showToast('下载路径功能不可用', true); return }
    pathBtn.disabled = true
    Promise.resolve(api.downloadsPickDir()).then(function (r) {
      if (r && r.ok && r.dir) setPath(r.dir)
      else if (r && r.ok === false && !r.canceled) showToast('更改失败：' + (r.reason || '未知错误'), true)
      // 取消（r.canceled）则不打扰
    }).catch(function (err) { showToast('更改失败：' + (err && err.message ? err.message : err), true) })
      .then(function () { pathBtn.disabled = false })
  })

  // 首次拉取 + 实时订阅
  if (api.downloadsList) { api.downloadsList().then(render).catch(function () { render([]) }) }
  if (api.onDownloadsChanged) { api.onDownloadsChanged(render) }
  // 当前账号：展示归属 + 切换账号时刷新
  if (api.downloadsCurrentUser) { api.downloadsCurrentUser().then(setUser).catch(function () {}) }
  if (api.onDownloadsUserChanged) { api.onDownloadsUserChanged(setUser) }
  // 下载位置：首次拉取 + 主进程广播变更时刷新展示
  if (api.downloadsGetDir) { api.downloadsGetDir().then(setPath).catch(function () {}) }
  if (api.onDownloadsDirChanged) { api.onDownloadsDirChanged(setPath) }
})();
</script>
</body>
</html>
