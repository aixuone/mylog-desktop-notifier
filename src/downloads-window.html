<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>下载中心 · e日志</title>
<style>
@font-face {
  font-family: 'System UI';
  src: local('Microsoft YaHei UI'), local('Microsoft YaHei'),
       local('PingFang SC'), local('PingFang HK'),
       local('Noto Sans CJK SC'), local('SimHei'),
       local(system-ui), local(sans-serif);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'System UI', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #2C2C2A; height: 100vh; overflow: hidden;
  background:
    radial-gradient(520px 300px at 100% 0%, rgba(24,95,165,0.13), transparent 60%),
    radial-gradient(420px 260px at 0% 100%, rgba(255,149,0,0.10), transparent 55%),
    linear-gradient(160deg, #FBFCFE 0%, #F2F5FA 100%);
  -webkit-font-smoothing: antialiased;
  border: 1px solid rgba(24,95,165,0.18);
  border-radius: 12px;
  user-select: none;
}
/* ── 标题栏（可拖拽） ── */
.titlebar {
  display: flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 10px 0 14px;
  -webkit-app-region: drag;
  border-bottom: 1px solid rgba(24,95,165,0.10);
}
.titlebar .logo { font-size: 15px; }
.titlebar .title { font-size: 13px; font-weight: 700; letter-spacing: .2px; flex: 1; }
.titlebar .count { font-size: 11px; color: #9A9893; font-weight: 400; }
.titlebar .close {
  -webkit-app-region: no-drag;
  width: 26px; height: 26px; border: none; border-radius: 7px;
  background: transparent; color: #8A8883; font-size: 14px; cursor: pointer;
  line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.titlebar .close:hover { background: rgba(220,38,38,.12); color: #DC2626; }

/* ── 列表 ── */
.list { height: calc(100vh - 92px); overflow-y: auto; padding: 8px 10px; }
.item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.72);
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: 0 4px 14px rgba(31,45,61,0.06);
  border-radius: 10px; padding: 9px 10px; margin-bottom: 8px;
}
.item .icon { font-size: 17px; width: 24px; text-align: center; flex-shrink: 0; }
.item .body { flex: 1; min-width: 0; }
.item .fname {
  font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 6px;
}
.item .fname .badge {
  flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 8px;
}
.badge.going { background: rgba(24,95,165,.12); color: #185FA5; }
.badge.done  { background: rgba(22,163,74,.14); color: #16A34A; }
.badge.fail  { background: rgba(220,38,38,.12); color: #DC2626; }
.item .meta { font-size: 11px; color: #9A9893; margin-top: 2px; }
/* 进度条 */
.pbar { height: 4px; border-radius: 2px; background: #E7E5E0; margin-top: 6px; overflow: hidden; }
.pbar > i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #185FA5, #2F7FD0); transition: width .3s; }
.pbar.done > i { background: linear-gradient(90deg, #16A34A, #4ADE80); }
.pbar.fail > i { background: #DC2626; }

/* 操作按钮 */
.ops { display: flex; gap: 4px; flex-shrink: 0; }
.ops button {
  border: 1px solid #D8D5CF; background: #fff; color: #6B6864;
  font-family: inherit; padding: 0; width: 28px; height: 28px; border-radius: 7px; cursor: pointer;
  transition: border-color .15s, color .15s, background .15s, transform .1s;
  display: inline-flex; align-items: center; justify-content: center;
}
.ops button:hover { border-color: #185FA5; color: #185FA5; background: rgba(24,95,165,.06); }
.ops button:active { transform: scale(.92); }
.ops button.danger:hover { border-color: #DC2626; color: #DC2626; background: rgba(220,38,38,.06); }
.ops button:disabled { opacity: .45; cursor: not-allowed; }

/* 空状态 */
.empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: #A5A29C; font-size: 12.5px;
}
.empty .big { font-size: 30px; }

/* ── 底部操作栏 ── */
.footer {
  height: 50px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; border-top: 1px solid rgba(24,95,165,0.10);
}
.footer .tip { font-size: 11px; color: #A5A29C; }
.footer button {
  border: 1px solid #D8D5CF; background: #fff; color: #2C2C2A;
  font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.footer button:hover { border-color: #185FA5; color: #185FA5; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="logo">⬇️</span>
    <span class="title">下载中心</span>
    <span class="count" id="dl-count"></span>
    <button class="close" id="btn-close" title="关闭">✕</button>
  </div>

  <div class="list" id="dl-list"></div>

  <div class="footer">
    <span class="tip">下载完成后自动保存到「下载」文件夹</span>
    <button id="btn-clear">清空已完成</button>
  </div>

<script>
;(function () {
  var api = window.electronAPI || {}
  var listEl = document.getElementById('dl-list')
  var countEl = document.getElementById('dl-count')
  var clearBtn = document.getElementById('btn-clear')
  var closeBtn = document.getElementById('btn-close')

  var ICONS = {
    progressing: '⏳', completed: '✅', interrupted: '⚠️', cancelled: '🚫',
  }
  var BADGE = {
    progressing: '<span class="badge going">下载中</span>',
    completed: '<span class="badge done">完成</span>',
    interrupted: '<span class="badge fail">失败</span>',
    cancelled: '<span class="badge fail">已取消</span>',
  }
  // 操作按钮图标（stroke 风格 SVG，currentColor 继承）
  var BTN = {
    cancel: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 L18 18 M6 18 L18 6"/></svg>',
    open: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="12" y2="18"/><polyline points="9 15 12 12 15 15"/></svg>',
    folder: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
    browser: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  }
  function fmtBytes(n) {
    if (!n || n <= 0) return ''
    var u = ['B', 'KB', 'MB', 'GB'], i = 0
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ }
    return (i ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]
  }
  function fmtSize(d) {
    var r = fmtBytes(d.receivedBytes), t = fmtBytes(d.totalBytes)
    if (!r && !t) return ''
    return (r || '?') + (t ? ' / ' + t : '')
  }
  function pct(d) {
    if (d.state !== 'progressing' || !d.totalBytes) return 100
    return Math.min(100, Math.round((d.receivedBytes / d.totalBytes) * 100))
  }

  function render(list) {
    list = list || []
    var active = list.filter(function (d) { return d.state === 'progressing' }).length
    countEl.textContent = active ? active + ' 个进行中' : '共 ' + list.length + ' 个任务'

    if (!list.length) {
      listEl.innerHTML =
        '<div class="empty"><span class="big">📭</span><span>暂无下载任务</span>' +
        '<span>在网页里点击附件 / 文件链接即可下载到这里</span></div>'
      clearBtn.disabled = true
      return
    }
    var hasFinished = list.some(function (d) { return d.state !== 'progressing' })
    clearBtn.disabled = !hasFinished

    listEl.innerHTML = list.map(function (d) {
      var isGoing = d.state === 'progressing'
      var doneOk = d.state === 'completed'
      var fail = d.state === 'interrupted'
      var cancelled = d.state === 'cancelled'
      var barCls = doneOk ? 'pbar done' : (fail || cancelled ? 'pbar fail' : 'pbar')
      var ops = '<div class="ops">'
      if (isGoing) {
        ops += '<button data-act="cancel" data-id="' + d.id + '" class="danger" title="取消本次下载">' + BTN.cancel + '</button>'
      } else if (doneOk) {
        ops += '<button data-act="open" data-id="' + d.id + '" title="用系统默认程序打开该文件">' + BTN.open + '</button>' +
               '<button data-act="folder" data-id="' + d.id + '" title="在资源管理器中定位该文件">' + BTN.folder + '</button>' +
               '<button data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">' + BTN.browser + '</button>'
      } else if (fail) {
        ops += '<button data-act="folder" data-id="' + d.id + '" title="在资源管理器中定位该文件">' + BTN.folder + '</button>' +
               '<button data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">' + BTN.browser + '</button>'
      } else if (cancelled) {
        ops += '<button data-act="browser" data-id="' + d.id + '" title="用系统浏览器重新下载">' + BTN.browser + '</button>'
      }
      ops += '</div>'
      return '<div class="item">' +
        '<span class="icon">' + (ICONS[d.state] || '📄') + '</span>' +
        '<div class="body">' +
          '<div class="fname">' + escapeHtml(d.filename || '未知文件') + BADGE[d.state] + '</div>' +
          '<div class="meta">' + fmtSize(d) + (isGoing ? ' · ' + pct(d) + '%' : '') + '</div>' +
          '<div class="' + barCls + '"><i style="width:' + pct(d) + '%"></i></div>' +
        '</div>' + ops + '</div>'
    }).join('')
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    })
  }

  // 事件委托：按钮
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button')
    if (!btn) return
    var id = btn.getAttribute('data-id')
    var act = btn.getAttribute('data-act')
    if (act === 'open' && api.downloadsOpen) api.downloadsOpen(id)
    else if (act === 'folder' && api.downloadsOpenFolder) api.downloadsOpenFolder(id)
    else if (act === 'browser' && api.downloadsOpenInBrowser) api.downloadsOpenInBrowser(id)
    else if (act === 'cancel' && api.downloadsCancel) { btn.disabled = true; api.downloadsCancel(id) }
  })
  clearBtn.addEventListener('click', function () { if (api.downloadsClear) api.downloadsClear() })
  closeBtn.addEventListener('click', function () { window.close() })

  // 首次拉取 + 实时订阅
  if (api.downloadsList) { api.downloadsList().then(render).catch(function () { render([]) }) }
  if (api.onDownloadsChanged) { api.onDownloadsChanged(render) }
})();
</script>
</body>
</html>
